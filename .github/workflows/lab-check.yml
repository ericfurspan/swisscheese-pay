name: Cumulative Lab Check

on:
  push:
    branches:
      - lab/all-vulnerabilities
  pull_request:
    branches:
      - lab/all-vulnerabilities

permissions:
  contents: read

jobs:
  verify-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - name: Confirm the four expected static findings
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.161.0
          semgrep scan --config .semgrep.yml --metrics off --disable-version-check --json \
            --output semgrep.json server/src client/src docker-compose.yml
          test "$(jq '.results | length' semgrep.json)" -eq 4
          for rule in \
            scpay.react.dangerously-set-inner-html \
            scpay.express.reflected-cors-origin \
            scpay.profile.accepts-role \
            scpay.compose.hardcoded-jwt-secret; do
            jq -e --arg rule "$rule" 'any(.results[]; .check_id == $rule)' semgrep.json >/dev/null
          done
      - name: Reproduce all nine intentional vulnerabilities
        run: make verify-lab
