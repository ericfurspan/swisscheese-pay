name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Syntax-check exploit and detection scripts
        run: |
          set -euo pipefail
          for f in security/exploits/*.sh security/detections/*.sh; do
            bash -n "$f"
          done
          for f in security/exploits/*.mjs; do
            node --check "$f"
          done
      - name: Replay detection fixtures
        run: ./security/detections/run-fixtures.sh

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for the app to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8082/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "App did not become healthy in time" >&2
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down
