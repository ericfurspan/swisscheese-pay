name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Syntax-check exploit and detection scripts
        run: |
          set -euo pipefail
          for f in security/exploits/*.sh security/detections/*.sh; do
            bash -n "$f"
          done
          for f in security/exploits/*.mjs; do
            node --check "$f"
          done
      - name: Replay detection fixtures
        run: ./security/detections/run-fixtures.sh
