services:
  swisscheese-pay:
    build: .
    ports:
      - '127.0.0.1:8082:8082'
    environment:
      # Bind inside the container's network namespace, not the host -- the
      # loopback-only guarantee comes from the port spec above, not this.
      - HOST=0.0.0.0
      # vuln/phase-4-jwt: set explicitly for session continuity across
      # restarts during QA -- see server/src/auth/token.ts for what this
      # overrides and why that's a problem.
      - JWT_SECRET=swisscheese-qa-2024
    restart: unless-stopped
