services:
  swisscheese-pay:
    build: .
    ports:
      - '127.0.0.1:8082:8082'
    environment:
      # Bind inside the container's network namespace, not the host -- the
      # loopback-only guarantee comes from the port spec above, not this.
      - HOST=0.0.0.0
      # Intentionally weak and committed for the JWT cracking exercise.
      # This lab branch must remain loopback-only.
      - JWT_SECRET=swisscheese-qa-2024
    restart: unless-stopped
